<!DOCTYPE html>
<html>
<head>
    <title>Zelix Wallet</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>💰 Zelix Wallet</h1>

<div id="loginBox">
    <h2>Login</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>
</div>


<div id="walletBox" style="display:none">

<h2>Dashboard</h2>

<p id="balance"></p>

<button onclick="getBalance()">Refresh Balance</button>

<h3>Deposit</h3>
<input id="depositAmount" placeholder="Amount">
<button onclick="deposit()">Deposit</button>


<h3>Withdraw</h3>
<input id="withdrawAmount" placeholder="Amount">
<button onclick="withdraw()">Withdraw</button>


<h3>Transactions</h3>
<button onclick="transactions()">View History</button>

<pre id="result"></pre>

</div>

</div>


<script src="app.js"></script>

</body>
</html>
